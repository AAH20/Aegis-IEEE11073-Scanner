[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-11073-scanner"
version = "0.1.0"
description = "Aegis-11073-Scanner: brutally technical IEEE 11073 PCAP / MBAN auditor for plaintext telemetry, missing MACs, and cyber-physical latency anomalies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aegis Cyber-Physical Security", email = "security@example.com" }
]
keywords = [
    "ieee11073",
    "medtech",
    "mban",
    "wban",
    "security",
    "pcap",
    "audit",
    "scapy",
    "cyber-physical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.5.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/aegis-11073-scanner"
Issues = "https://github.com/your-org/aegis-11073-scanner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
